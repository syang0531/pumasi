name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/montecarlo
      - name: Unit and end-to-end tests
        run: cargo test --workspace
      - name: Build sample module
        run: cargo build --release --target wasm32-wasip1 --manifest-path examples/montecarlo/Cargo.toml
      - name: Run sample module in the local sandbox
        shell: bash
        run: |
          cargo run --release -p pumasi-cli -- exec \
            examples/montecarlo/target/wasm32-wasip1/release/montecarlo.wasm sample 1 100000 \
            | tee sample.txt
          grep -q "^1 " sample.txt

  microvm:
    name: microvm (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [firecracker, qemu]
    env:
      VM_DIR: ${{ github.workspace }}/.vm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: microvm
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        if: matrix.backend == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build the guest init (static musl binary)
        run: cargo build --release -p pumasi-guest --target x86_64-unknown-linux-musl
      - name: Install the guest kernel, Firecracker and the guest init
        run: |
          cargo run -p pumasi-cli -- vm setup --vm-dir "$VM_DIR" \
            --guest target/x86_64-unknown-linux-musl/release/pumasi-guest
          cargo run -p pumasi-cli -- vm status --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }}
      - name: End-to-end test (cluster, invited provider, microVM jobs)
        env:
          PUMASI_TEST_VM_DIR: ${{ env.VM_DIR }}
          PUMASI_TEST_VM_BACKEND: ${{ matrix.backend }}
        run: cargo test -p pumasi-cluster --test e2e microvm -- --nocapture
      - name: Run the word count example's Python image in a microVM
        run: |
          cargo run -p pumasi-cli -- vm run --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }} \
            --input examples/python-wordcount --cpus 1 --memory-mb 256 --out vm-out \
            python:3.12-slim -- python /input/count.py 0 1 < /dev/null | tee vm.txt
          grep -q "^shard 0/1: 12 files" vm.txt
          test -s vm-out/counts.json
      - name: Show a verbose boot when a microVM step failed
        if: failure()
        env:
          PUMASI_VM_KERNEL_ARGS: loglevel=8 ignore_loglevel earlyprintk=serial,ttyS0,115200
        run: |
          ./target/debug/pumasi vm run --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }} \
            busybox:1.36 -- uname -a < /dev/null || true
          if [ "${{ matrix.backend }}" = qemu ]; then
            initrd=$(ls "$VM_DIR"/initrd-*.cpio | head -n1)
            for machine in microvm microvm,pic=off microvm,pic=off,pit=off; do
              echo "=== bare boot, -M $machine ==="
              timeout 60 qemu-system-x86_64 -M $machine -accel kvm -cpu max -m 256 \
                -nodefaults -no-user-config -no-reboot -display none -serial stdio \
                -kernel "$VM_DIR/vmlinux" -initrd "$initrd" -d cpu_reset,guest_errors \
                -append "console=ttyS0 reboot=t panic=1 earlyprintk=serial,ttyS0 loglevel=8 rdinit=/init" \
                2>&1 | tail -n 60
              echo "=== exit ${PIPESTATUS[0]} ==="
            done
          fi

  guest:
    name: guest init (linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: guest
      - run: cargo build --release -p pumasi-guest --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: pumasi-guest-x86_64
          path: target/x86_64-unknown-linux-musl/release/pumasi-guest
          if-no-files-found: error

  # QEMU on Windows: WHPX where the runner offers it, and TCG.
  microvm-windows:
    name: microvm (windows, qemu)
    needs: guest
    runs-on: windows-latest
    env:
      VM_DIR: ${{ github.workspace }}\.vm
      PUMASI_EMBED_GUEST: ${{ github.workspace }}\guest\pumasi-guest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: microvm-windows
      - uses: actions/download-artifact@v4
        with:
          name: pumasi-guest-x86_64
          path: guest
      - name: Build with the guest init built in
        run: cargo build -p pumasi-cli
      # The QEMU installer takes ~12 minutes; reuse the installed copy.
      - uses: actions/cache@v4
        with:
          path: |
            .vm/qemu
            .vm/vmlinux
          key: vm-windows-qemu-20260811-kernel-6.1.102
      - name: Install the guest kernel and the pinned QEMU
        shell: bash
        run: |
          ./target/debug/pumasi vm setup --vm-dir "$VM_DIR"
          ./target/debug/pumasi vm status --vm-dir "$VM_DIR" | tee status.txt
          grep -q "built into this binary" status.txt
          grep -q "qemu-system-x86_64.exe" status.txt
      # Hosted Windows runners currently do have nested virtualization, so
      # this also tries the WHPX settings one by one (diagnostics only).
      - name: Try QEMU settings (diagnostics)
        continue-on-error: true
        shell: bash
        timeout-minutes: 25
        run: |
          try() {
            echo "::group::$1"
            shift
            env "$@" timeout 150 ./target/debug/pumasi vm run --vm-dir "$VM_DIR" busybox:1.36 -- echo vm-ok < /dev/null
            echo "exit $?"
            for f in $(find "$VM_DIR/run" -type f -name '*.log' 2>/dev/null); do echo "--- $f"; tail -c 3000 "$f"; echo; done
            echo "::endgroup::"
          }
          try "default" PUMASI_VM_KERNEL_ARGS=loglevel=6
          try "whpx irqchip on, Nehalem" PUMASI_QEMU_ACCEL=whpx PUMASI_VM_KERNEL_ARGS=loglevel=6
          try "whpx irqchip off, max" PUMASI_QEMU_ACCEL=whpx,kernel-irqchip=off PUMASI_QEMU_CPU=max PUMASI_VM_KERNEL_ARGS=loglevel=6
          try "whpx irqchip off, Nehalem, reboot=t" PUMASI_QEMU_ACCEL=whpx,kernel-irqchip=off "PUMASI_VM_KERNEL_ARGS=loglevel=6 reboot=t"
          try "tcg" PUMASI_QEMU_ACCEL=tcg PUMASI_VM_KERNEL_ARGS=loglevel=6
      - name: Run an image in a microVM
        shell: bash
        timeout-minutes: 20
        env:
          PUMASI_LOG: debug
        run: |
          mkdir -p in && echo "from the host" > in/note.txt
          ./target/debug/pumasi vm run --vm-dir "$VM_DIR" --input in --out vm-out \
            busybox:1.36 -- sh -c 'cat /input/note.txt; uname -m; echo done > /output/r.txt' \
            < /dev/null | tee vm.txt
          grep -q "^from the host" vm.txt
          grep -q "^x86_64" vm.txt
          grep -q "^done" vm-out/r.txt
          # And in software emulation, the fallback without WHPX.
          PUMASI_QEMU_ACCEL=tcg ./target/debug/pumasi vm run --vm-dir "$VM_DIR" \
            busybox:1.36 -- echo tcg-ok < /dev/null | tee tcg.txt
          grep -q "^tcg-ok" tcg.txt
      - name: End-to-end test (cluster, invited provider, microVM jobs)
        timeout-minutes: 30
        env:
          PUMASI_TEST_VM_DIR: ${{ env.VM_DIR }}
          PUMASI_TEST_VM_BACKEND: qemu
        run: cargo test -p pumasi-cluster --test e2e microvm -- --nocapture
      - name: Show the VM consoles and a bare boot when a microVM step failed
        if: failure() || cancelled()
        shell: bash
        run: |
          tasklist | grep -i qemu || true
          taskkill //F //IM qemu-system-x86_64.exe 2>/dev/null || true
          find "$VM_DIR/run" -type f \( -name '*.log' -o -name '*.json' \) 2>/dev/null | while read -r f; do
            echo "=== $f"; tail -c 4000 "$f"; echo
          done
          qemu="$VM_DIR/qemu/qemu-system-x86_64.exe"
          initrd=$(ls "$VM_DIR"/initrd-*.cpio | head -n1)
          echo "=== bare boot (no disks), TCG"
          timeout 120 "$qemu" -M microvm -accel tcg -cpu max -m 256 -nodefaults -no-user-config \
            -no-reboot -display none -serial file:bare.log -kernel "$VM_DIR/vmlinux" -initrd "$initrd" \
            -append "console=ttyS0 reboot=t panic=1 earlyprintk=serial,ttyS0 loglevel=8 rdinit=/init tsc_early_khz=2000000" \
            < /dev/null; echo "exit $?"
          tail -c 6000 bare.log

  service:
    name: service and upgrade (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Smaller binaries to roll out (debug info makes them ~650 MiB).
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_DEV_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: service
      - name: Build an old and a new agent binary
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/b"
          cargo build -p pumasi-cli
          cp "target/debug/pumasi$ext" "$RUNNER_TEMP/b/pumasi-old$ext"
          PUMASI_BUILD_ID=ci-new cargo build -p pumasi-cli
          cp "target/debug/pumasi$ext" "$RUNNER_TEMP/b/pumasi-new$ext"
          "$RUNNER_TEMP/b/pumasi-old$ext" --version
          "$RUNNER_TEMP/b/pumasi-new$ext" --version
          echo "EXT=$ext" >> "$GITHUB_ENV"
      - name: Install script checks the SHA-256 (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os=linux; [ "$RUNNER_OS" = macOS ] && os=macos
          arch=$(uname -m); [ "$arch" = arm64 ] && arch=aarch64
          rel="$RUNNER_TEMP/rel"; mkdir -p "$rel"
          cp "$RUNNER_TEMP/b/pumasi-new" "$rel/pumasi-$os-$arch"
          (cd "$rel" && shasum -a 256 "pumasi-$os-$arch" > SHA256SUMS)
          sh scripts/install.sh --base-url "$rel" --dir "$RUNNER_TEMP/inst"
          "$RUNNER_TEMP/inst/pumasi" --version | grep -q "ci-new"
          echo tampered >> "$rel/pumasi-$os-$arch"
          if sh scripts/install.sh --base-url "$rel" --dir "$RUNNER_TEMP/inst2"; then
            echo "a tampered binary was installed"; exit 1
          fi
      - name: Install script checks the SHA-256 (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'b\pumasi-new.exe') (Join-Path $rel 'pumasi-windows-x86_64.exe')
          $h = (Get-FileHash -Algorithm SHA256 (Join-Path $rel 'pumasi-windows-x86_64.exe')).Hash.ToLower()
          Set-Content (Join-Path $rel 'SHA256SUMS') "$h  pumasi-windows-x86_64.exe"
          $inst = Join-Path $env:RUNNER_TEMP 'inst'
          ./scripts/install.ps1 -BaseUrl $rel -Dir $inst -NoPath
          $v = & (Join-Path $inst 'pumasi.exe') --version
          if ($v -notmatch 'ci-new') { throw "unexpected version $v" }
          Add-Content (Join-Path $rel 'pumasi-windows-x86_64.exe') 'tampered'
          $failed = $false
          try { ./scripts/install.ps1 -BaseUrl $rel -Dir (Join-Path $env:RUNNER_TEMP 'inst2') -NoPath } catch { $failed = $true }
          if (-not $failed) { throw 'a tampered binary was installed' }
      - name: Install as a service, restart, roll out the new binary, uninstall
        shell: bash
        run: |
          scripts/ci/service-upgrade.sh "$RUNNER_TEMP/b/pumasi-old$EXT" \
            "$RUNNER_TEMP/b/pumasi-new$EXT" "$RUNNER_TEMP/svc"
