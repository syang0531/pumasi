name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the last Intel image, for old Intel Macs.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            examples/montecarlo
      - name: Private registry for the private image tests
        if: runner.os == 'Linux'
        run: scripts/ci/private-registry.sh
      - name: promtool, to check the /metrics scrape
        if: runner.os == 'Linux'
        run: |
          v=3.5.0
          curl -sSfL -o "$RUNNER_TEMP/prom.tgz" \
            "https://github.com/prometheus/prometheus/releases/download/v$v/prometheus-$v.linux-amd64.tar.gz"
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $RUNNER_TEMP/prom.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/prom.tgz" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-$v.linux-amd64/promtool"
          echo "PUMASI_PROMTOOL=$RUNNER_TEMP/promtool" >> "$GITHUB_ENV"
      - name: Software Vulkan driver (lavapipe), for the WebGPU tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          echo "PUMASI_TEST_WEBGPU=require" >> "$GITHUB_ENV"
      - name: Unit and end-to-end tests
        run: cargo test --workspace
      - name: Build sample module
        run: cargo build --release --target wasm32-wasip1 --manifest-path examples/montecarlo/Cargo.toml
      - name: Run sample module in the local sandbox
        shell: bash
        run: |
          cargo run --release -p pumasi-cli -- exec \
            examples/montecarlo/target/wasm32-wasip1/release/montecarlo.wasm sample 1 100000 \
            | tee sample.txt
          grep -q "^1 " sample.txt

  # WebGPU (phase 14): the same wasm modules on each OS's GPU API (Vulkan
  # with lavapipe on Linux, DX12 on Windows, Metal on macOS), checked
  # against the CPU and compared across the OSes in `webgpu-compare`.
  # Hosted runners have no real GPUs, so software rasterizers stand in;
  # where a runner has no usable adapter at all, the job says so and the
  # comparison goes on without it.
  webgpu:
    name: webgpu (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require: true
          - os: windows-latest
            require: false
          - os: macos-latest
            require: false
          - os: macos-15-intel
            require: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: webgpu
          workspaces: |
            .
            examples/webgpu
      - name: Software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: cargo build --release -p pumasi-cli
      - name: Build the example modules
        run: cargo build --release --target wasm32-wasip1 --manifest-path examples/webgpu/Cargo.toml
      - name: Adapters
        shell: bash
        run: |
          bin=target/release/pumasi
          "$bin" gpu webgpu --software | tee adapters.txt
          if grep -q "^WebGPU " adapters.txt; then
            echo "HAS_GPU=true" >> "$GITHUB_ENV"
          elif [ "${{ matrix.require }}" = true ]; then
            echo "no WebGPU adapter on ${{ matrix.os }}"; exit 1
          else
            echo "::notice::no WebGPU adapter on ${{ matrix.os }}; its examples are skipped"
          fi
      - name: Matrix multiplication and blur on the GPU, checked against the CPU
        if: env.HAS_GPU == 'true'
        shell: bash
        run: |
          bin=target/release/pumasi
          mods=examples/webgpu/target/wasm32-wasip1/release
          mkdir -p out
          "$bin" exec --gpu --webgpu-software --memory-mb 512 --out out "$mods/matmul.wasm" 512 | tee matmul.txt
          grep -q ": ok$" matmul.txt
          "$bin" exec --gpu --webgpu-software --memory-mb 512 --out out "$mods/blur.wasm" 6 | tee blur.txt
          grep -q ": ok$" blur.txt
          test -s out/blurred.ppm
          mkdir -p report
          cp out/matmul.json "report/matmul-${{ matrix.os }}.json"
          grep "^adapter: " matmul.txt | head -n1 > "report/adapter-${{ matrix.os }}.txt"
          grep "^blur " blur.txt > "report/blur-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        if: env.HAS_GPU == 'true'
        with:
          name: webgpu-${{ matrix.os }}
          path: report
          if-no-files-found: error

  webgpu-compare:
    name: webgpu (same results on every OS)
    needs: webgpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: webgpu-*
          merge-multiple: true
          path: report
      - name: Compare the runs
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os, sys
          runs = {}
          for f in sorted(glob.glob("report/matmul-*.json")):
              os_name = f[len("report/matmul-"):-len(".json")]
              runs[os_name] = json.load(open(f))
          assert "ubuntu-latest" in runs, "the Linux run is missing"
          print("| OS | adapter | GPU ms | CPU ms | speedup | max rel. error |")
          print("| --- | --- | ---: | ---: | ---: | ---: |")
          for name, r in runs.items():
              print(f"| {name} | {r['adapter']} ({r['backend']}) | {r['gpu_ms']:.1f} | {r['cpu_ms']:.1f} | "
                    f"{r['cpu_ms'] / max(r['gpu_ms'], 1e-3):.1f}x | {r['max_relative_error']:.1e} |")
          ok = all(r["ok"] for r in runs.values())
          cpu = {r["checksum_cpu"] for r in runs.values()}
          gpu = [r["checksum_gpu"] for r in runs.values()]
          ref = next(iter(cpu))
          spread = max(abs(g - ref) / abs(ref) for g in gpu)
          print()
          print(f"CPU checksums identical on every OS: {len(cpu) == 1}; GPU checksums within {spread:.1e} of them")
          sys.exit(0 if ok and len(cpu) == 1 and spread <= 1e-3 else 1)
          PY

  # The web dashboard in a real browser against a real local cluster
  # (control plane, two WASM agents, `pumasi ui`). Node is only for the
  # tests; the dashboard itself is built into the binary.
  dashboard:
    name: dashboard (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/dashboard/e2e/package-lock.json
      - run: cargo build -p pumasi-cli
      # Phase 15: every curl example in docs/api.md, against a local
      # cluster behind `pumasi ui --api-only`.
      - name: docs/api.md examples
        run: scripts/ci/api-doc.sh target/debug/pumasi
      - name: Install Playwright and Chromium
        working-directory: crates/dashboard/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Submit, follow, download and drain from the browser
        working-directory: crates/dashboard/e2e
        run: npx playwright test
      - name: Keep the traces and cluster logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e
          path: |
            crates/dashboard/e2e/test-results
            crates/dashboard/e2e/playwright-report
          if-no-files-found: ignore

  microvm:
    name: microvm (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [firecracker, qemu]
    env:
      VM_DIR: ${{ github.workspace }}/.vm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: microvm
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        if: matrix.backend == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build the guest init (static musl binary)
        run: cargo build --release -p pumasi-guest --target x86_64-unknown-linux-musl
      - name: Install the guest kernel, Firecracker and the guest init
        run: |
          cargo run -p pumasi-cli -- vm setup --vm-dir "$VM_DIR" \
            --guest target/x86_64-unknown-linux-musl/release/pumasi-guest
          cargo run -p pumasi-cli -- vm status --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }}
      - name: Private registry for the private image test
        run: scripts/ci/private-registry.sh
      - name: End-to-end test (cluster, invited provider, microVM jobs, private image)
        env:
          PUMASI_TEST_VM_DIR: ${{ env.VM_DIR }}
          PUMASI_TEST_VM_BACKEND: ${{ matrix.backend }}
        run: cargo test -p pumasi-cluster --test e2e microvm -- --nocapture
      - name: Run the word count example's Python image in a microVM
        run: |
          cargo run -p pumasi-cli -- vm run --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }} \
            --input examples/python-wordcount --cpus 1 --memory-mb 256 --out vm-out \
            python:3.12-slim -- python /input/count.py 0 1 < /dev/null | tee vm.txt
          grep -q "^shard 0/1: 12 files" vm.txt
          test -s vm-out/counts.json
      - name: Show a verbose boot when a microVM step failed
        if: failure()
        env:
          PUMASI_VM_KERNEL_ARGS: loglevel=8 ignore_loglevel earlyprintk=serial,ttyS0,115200
        run: |
          ./target/debug/pumasi vm run --vm-dir "$VM_DIR" --vm-backend ${{ matrix.backend }} \
            busybox:1.36 -- uname -a < /dev/null || true
          if [ "${{ matrix.backend }}" = qemu ]; then
            grep -m1 "model name" /proc/cpuinfo || true
            ls -l "$VM_DIR"
            initrd=$(ls "$VM_DIR"/initrd-*.cpio | head -n1)
            truncate -s 64M "$RUNNER_TEMP/disk.img"
            echo "=== boot as the agent does, with one empty disk ==="
            timeout 60 qemu-system-x86_64 -M microvm,pic=off,pit=off -accel kvm -cpu max -m 512 -smp 1 \
              -nodefaults -no-user-config -no-reboot -display none -serial stdio \
              -kernel "$VM_DIR/vmlinux" -initrd "$initrd" \
              -append "console=ttyS0 reboot=t panic=1 loglevel=8 ignore_loglevel rdinit=/init pumasi.mode=build" \
              -drive id=d0,file="$RUNNER_TEMP/disk.img",format=raw,if=none,readonly=off \
              -device virtio-blk-device,drive=d0 2>&1 | head -n 400
            echo "=== exit ${PIPESTATUS[0]} ==="
          fi

  guest:
    name: guest init (linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guest
      - run: cargo build --release -p pumasi-guest --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: pumasi-guest-x86_64
          path: target/x86_64-unknown-linux-musl/release/pumasi-guest
          if-no-files-found: error

  # Phase 17: advisories, licenses and sources of every dependency
  # (deny.toml), and RustSec once more through cargo-audit
  # (.cargo/audit.toml carries the same justified ignores).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # Phase 17: every fuzz target (fuzz/) for a minute. A crash fails the
  # job and keeps the input that caused it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: fuzz
          workspaces: fuzz
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz defaults to its own (musl) target, which
      # the sanitizer cannot use.
      - run: cargo fuzz build -O --debug-assertions --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run -O --debug-assertions --target x86_64-unknown-linux-gnu "$t" -- \
              -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Phase 17: a short soak (scripts/soak.sh): jobs through the API while
  # agents and the control plane are killed and restarted. The 72-hour
  # run before a release uses the same script.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: soak
      - run: cargo build --release -p pumasi-cli
      - run: |
          scripts/soak.sh --bin target/release/pumasi --duration 10m --agents 3 \
            --agent-restart-every 90s --cluster-restart-every 4m --report soak-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-report
          path: soak-report
          if-no-files-found: ignore

  # SSO against real identity software (scripts/sso-e2e.sh): Keycloak for
  # the OIDC browser and device flows, OpenLDAP for LDAP, in Docker.
  sso-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: soak
      - run: cargo build --release -p pumasi-cli
      - run: scripts/sso-e2e.sh --bin target/release/pumasi

  # macOS: the binary's minimum OS, and the Virtualization.framework
  # helper (signing, loading the framework at run time). Hosted Mac
  # runners are VMs without nested virtualization, so booting a guest is
  # checked on real Macs; the helper still runs up to the framework's
  # answer.
  macos-vz:
    name: macos (vz, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            minos: "10.15"
          - os: macos-latest
            # Apple Silicon starts at macOS 11.
            minos: "11.0"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      VM_DIR: ${{ github.workspace }}/.vm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-vz
      - run: cargo build -p pumasi-cli
      - name: Minimum macOS, and Virtualization.framework not linked
        run: |
          bin=target/debug/pumasi
          vtool -show-build "$bin" | tee /dev/stderr | grep -Eq "(minos|version) ${{ matrix.minos }}( |$)"
          otool -L "$bin" | tee libs.txt
          if grep -q Virtualization libs.txt; then
            echo "Virtualization.framework is linked; the binary would not start on macOS 10.15"; exit 1
          fi
      - name: Set up microVMs (signs the helper)
        run: |
          # The Intel kernel is a release asset of this repository, which
          # exists once the guest kernel workflow ran on main.
          ./target/debug/pumasi vm setup --vm-dir "$VM_DIR" || echo "::warning::vm setup failed"
          ./target/debug/pumasi vm status --vm-dir "$VM_DIR" | tee status.txt || true
          grep -Eq "^  vz +(usable|not usable)" status.txt
          codesign -d --entitlements - "$VM_DIR/pumasi-vz" 2>&1 | tee ent.txt
          grep -q com.apple.security.virtualization ent.txt
      - name: The helper runs a VM config up to the framework
        run: |
          head -c 1048576 /dev/zero > disk.img
          echo kernel > kernel; echo initrd > initrd
          cat > vz.json <<JSON
          {"kernel":"$PWD/kernel","initrd":"$PWD/initrd","cmdline":"console=hvc0","disks":[["$PWD/disk.img",true]],"cpus":1,"mem_mib":256}
          JSON
          set +e
          "$VM_DIR/pumasi-vz" __vz-run vz.json > out.txt 2>&1
          code=$?
          set -e
          cat out.txt; echo "exit $code"
          # 0: it booted and stopped; 1: a reported error (no nested
          # virtualization here, or the fake kernel). Anything else is a crash.
          [ "$code" -le 1 ]
          [ "$code" = 0 ] || grep -q "^pumasi-vz: " out.txt

  # QEMU on Windows: WHPX where the runner offers it, and TCG.
  microvm-windows:
    name: microvm (windows, qemu)
    needs: guest
    runs-on: windows-latest
    env:
      VM_DIR: ${{ github.workspace }}\.vm
      PUMASI_EMBED_GUEST: ${{ github.workspace }}\guest\pumasi-guest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: microvm-windows
      - uses: actions/download-artifact@v4
        with:
          name: pumasi-guest-x86_64
          path: guest
      - name: Build with the guest init built in
        run: cargo build -p pumasi-cli
      # The QEMU installer takes ~12 minutes; reuse the installed copy.
      - uses: actions/cache@v4
        with:
          path: |
            .vm/qemu
            .vm/vmlinux
          key: vm-windows-qemu-20260811-kernel-6.1.102
      - name: Install the guest kernel and the pinned QEMU
        shell: bash
        run: |
          # The host CPU, to tell runner machines apart when a boot fails.
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          ./target/debug/pumasi vm setup --vm-dir "$VM_DIR"
          ./target/debug/pumasi vm status --vm-dir "$VM_DIR" | tee status.txt
          grep -q "built into this binary" status.txt
          grep -q "qemu-system-x86_64.exe" status.txt
      - name: Run an image in a microVM
        shell: bash
        timeout-minutes: 20
        env:
          PUMASI_LOG: debug
        run: |
          mkdir -p in && echo "from the host" > in/note.txt
          # Hosted runners have WHPX, nested under Hyper-V, where QEMU's
          # virtio disks break; the probe VM notices and falls back to TCG.
          ./target/debug/pumasi vm run --vm-dir "$VM_DIR" --input in --out vm-out \
            busybox:1.36 -- sh -c 'cat /input/note.txt; uname -m; echo done > /output/r.txt' \
            < /dev/null 2>&1 | tee vm.txt
          if grep -q "do not work under WHPX" vm.txt; then
            echo "::notice::the WHPX probe VM failed on this runner; microVMs ran under TCG"
          fi
          grep -q "^from the host" vm.txt
          grep -q "^x86_64" vm.txt
          grep -q "^done" vm-out/r.txt
          # And in software emulation, the fallback without WHPX.
          PUMASI_QEMU_ACCEL=tcg ./target/debug/pumasi vm run --vm-dir "$VM_DIR" \
            busybox:1.36 -- echo tcg-ok < /dev/null | tee tcg.txt
          grep -q "^tcg-ok" tcg.txt
      - name: End-to-end test (cluster, invited provider, microVM jobs)
        timeout-minutes: 30
        env:
          PUMASI_TEST_VM_DIR: ${{ env.VM_DIR }}
          PUMASI_TEST_VM_BACKEND: qemu
        run: cargo test -p pumasi-cluster --test e2e microvm -- --nocapture
      - name: Show the VM consoles and a bare boot when a microVM step failed
        if: failure() || cancelled()
        shell: bash
        run: |
          tasklist | grep -i qemu || true
          taskkill //F //IM qemu-system-x86_64.exe 2>/dev/null || true
          find "$VM_DIR/run" -type f \( -name '*.log' -o -name '*.json' \) 2>/dev/null | while read -r f; do
            echo "=== $f"; tail -c 4000 "$f"; echo
          done
          qemu="$VM_DIR/qemu/qemu-system-x86_64.exe"
          initrd=$(ls "$VM_DIR"/initrd-*.cpio | head -n1)
          echo "=== bare boot (no disks), TCG"
          timeout 120 "$qemu" -M microvm,pic=off,pit=off -accel tcg -cpu max -m 256 -nodefaults -no-user-config \
            -no-reboot -display none -serial file:bare.log -kernel "$VM_DIR/vmlinux" -initrd "$initrd" \
            -append "console=ttyS0 reboot=t panic=1 earlyprintk=serial,ttyS0 loglevel=8 rdinit=/init tsc_early_khz=2000000" \
            < /dev/null; echo "exit $?"
          tail -c 6000 bare.log

  service:
    name: service and upgrade (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Smaller binaries to roll out (debug info makes them ~650 MiB).
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_DEV_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: service
      - name: Build an old and a new agent binary
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/b"
          cargo build -p pumasi-cli
          cp "target/debug/pumasi$ext" "$RUNNER_TEMP/b/pumasi-old$ext"
          PUMASI_BUILD_ID=ci-new cargo build -p pumasi-cli
          cp "target/debug/pumasi$ext" "$RUNNER_TEMP/b/pumasi-new$ext"
          "$RUNNER_TEMP/b/pumasi-old$ext" --version
          "$RUNNER_TEMP/b/pumasi-new$ext" --version
          echo "EXT=$ext" >> "$GITHUB_ENV"
      - name: Install script checks the SHA-256 (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os=linux; [ "$RUNNER_OS" = macOS ] && os=macos
          arch=$(uname -m); [ "$arch" = arm64 ] && arch=aarch64
          rel="$RUNNER_TEMP/rel"; mkdir -p "$rel"
          cp "$RUNNER_TEMP/b/pumasi-new" "$rel/pumasi-$os-$arch"
          (cd "$rel" && shasum -a 256 "pumasi-$os-$arch" > SHA256SUMS)
          sh scripts/install.sh --base-url "$rel" --dir "$RUNNER_TEMP/inst"
          "$RUNNER_TEMP/inst/pumasi" --version | grep -q "ci-new"
          echo tampered >> "$rel/pumasi-$os-$arch"
          if sh scripts/install.sh --base-url "$rel" --dir "$RUNNER_TEMP/inst2"; then
            echo "a tampered binary was installed"; exit 1
          fi
      - name: Install script checks the SHA-256 (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'b\pumasi-new.exe') (Join-Path $rel 'pumasi-windows-x86_64.exe')
          $h = (Get-FileHash -Algorithm SHA256 (Join-Path $rel 'pumasi-windows-x86_64.exe')).Hash.ToLower()
          Set-Content (Join-Path $rel 'SHA256SUMS') "$h  pumasi-windows-x86_64.exe"
          $inst = Join-Path $env:RUNNER_TEMP 'inst'
          ./scripts/install.ps1 -BaseUrl $rel -Dir $inst -NoPath
          $v = & (Join-Path $inst 'pumasi.exe') --version
          if ($v -notmatch 'ci-new') { throw "unexpected version $v" }
          Add-Content (Join-Path $rel 'pumasi-windows-x86_64.exe') 'tampered'
          $failed = $false
          try { ./scripts/install.ps1 -BaseUrl $rel -Dir (Join-Path $env:RUNNER_TEMP 'inst2') -NoPath } catch { $failed = $true }
          if (-not $failed) { throw 'a tampered binary was installed' }
      - name: Install as a service, restart, roll out the new binary, uninstall
        shell: bash
        run: |
          scripts/ci/service-upgrade.sh "$RUNNER_TEMP/b/pumasi-old$EXT" \
            "$RUNNER_TEMP/b/pumasi-new$EXT" "$RUNNER_TEMP/svc"
