name: KVM probe
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ls -la /dev/kvm || true
          nproc; free -m; uname -a
          sudo apt-get install -y cpu-checker >/dev/null 2>&1 || true
          kvm-ok || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
