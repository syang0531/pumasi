name: probe-qemu (temporary)
on:
  pull_request:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: List QEMU for Windows builds and hash the newest
        shell: bash
        run: |
          set -x
          curl -fsSL https://qemu.weilnetz.de/w64/ -o index.html
          grep -o 'qemu-w64-setup-[0-9]*\.exe' index.html | sort -u | tail -n 8
          grep -o 'href="20[0-9][0-9]/"' index.html | sort -u
          for y in 2025 2026; do
            curl -fsSL https://qemu.weilnetz.de/w64/$y/ -o idx-$y.html || continue
            grep -o 'qemu-w64-setup-[0-9]*\.exe' idx-$y.html | sort -u | tail -n 8
          done
          cat idx-2025.html idx-2026.html index.html 2>/dev/null | grep -Eo '<a href="qemu-w64-setup-[0-9]+\.exe">[^<]*</a>[^<]*' | tail -n 20 || true
          latest=$(cat index.html idx-*.html | grep -o 'qemu-w64-setup-[0-9]*\.exe' | sort -u | tail -n 1)
          echo "latest=$latest"
          for f in $(cat index.html idx-*.html | grep -o 'qemu-w64-setup-[0-9]*\.exe' | sort -u | tail -n 4); do
            for base in https://qemu.weilnetz.de/w64 https://qemu.weilnetz.de/w64/2025 https://qemu.weilnetz.de/w64/2026; do
              if curl -fsSL "$base/$f" -o "$f"; then
                echo "URL $base/$f"; sha256sum "$f"; ls -l "$f"; break
              fi
            done
          done
          echo "LATEST=$latest" >> "$GITHUB_ENV"
      - name: Silent install and check
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'qemu'
          $p = Start-Process -FilePath ".\$env:LATEST" -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          "exit $($p.ExitCode)"
          Get-ChildItem $dest | Select-Object -First 60 Name, Length | Format-Table | Out-String -Width 200
          & (Join-Path $dest 'qemu-system-x86_64.exe') -version
          & (Join-Path $dest 'qemu-system-x86_64.exe') -machine help | Select-String microvm
          & (Join-Path $dest 'qemu-system-x86_64.exe') -accel help
          (Get-ChildItem $dest -Recurse | Measure-Object -Sum Length).Sum
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.Name -match 'QEMU' } | ForEach-Object { $_.Name }
      - name: Docker on the runner
        shell: bash
        run: docker version --format '{{.Server.Os}} {{.Server.Version}}' || true
