[workspace]
resolver = "3"
members = ["crates/proto", "crates/agent", "crates/cluster", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/syang0531/pumasi"
rust-version = "1.90"

[workspace.dependencies]
pumasi-proto = { path = "crates/proto" }
pumasi-agent = { path = "crates/agent" }
pumasi-cluster = { path = "crates/cluster" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.4"
wasmtime = "50"
wasmtime-wasi = "50"
wat = "1"
blake3 = "1"
rand = "0.9"
data-encoding = "2"
sysinfo = "0.37"
redb = "4"
uuid = { version = "1", features = ["v4", "serde"] }
