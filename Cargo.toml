[workspace]
resolver = "3"
members = ["crates/proto", "crates/guest", "crates/agent", "crates/cluster", "crates/dashboard", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/syang0531/pumasi"
rust-version = "1.91"

[workspace.dependencies]
pumasi-proto = { path = "crates/proto" }
pumasi-agent = { path = "crates/agent" }
pumasi-cluster = { path = "crates/cluster" }
pumasi-guest = { path = "crates/guest" }
pumasi-dashboard = { path = "crates/dashboard" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.4"
iroh-blobs = { version = "0.104", default-features = false, features = ["fs-store"] }
n0-future = "0.3"
tokio-util = { version = "0.7", features = ["io-util"] }
wasmtime = "50"
wasmtime-wasi = "50"
wat = "1"
blake3 = "1"
rand = "0.9"
# Same version wasmtime-wasi uses, for seeding its random sources.
rand010 = { package = "rand", version = "0.10" }
data-encoding = "2"
sysinfo = "0.37"
# Local time of day for availability hours.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
redb = "4"
uuid = { version = "1", features = ["v4", "serde"] }
# microVM executor: image layers, the guest's disks and registry pulls.
tar = { version = "0.4.44", default-features = false }
flate2 = "1"
ruzstd = "0.8"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Control plane high availability (phase 13).
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2"] }
