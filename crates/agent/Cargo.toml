[package]
name = "pumasi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pumasi-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
iroh.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
blake3.workspace = true
sysinfo.workspace = true
serde_json.workspace = true
rand010.workspace = true
pumasi-guest.workspace = true
tar.workspace = true
flate2.workspace = true
sha2.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
chrono.workspace = true

[dev-dependencies]
wat.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# The Virtualization.framework backend talks to the Objective-C runtime and
# loads the framework at run time (macOS 10.15 has none).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

# Direct I/O and cache hints for the disk benchmark.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
