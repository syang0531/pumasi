[package]
name = "pumasi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pumasi"
path = "src/main.rs"

[dependencies]
pumasi-proto.workspace = true
pumasi-agent.workspace = true
pumasi-cluster.workspace = true
pumasi-dashboard.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
iroh.workspace = true
toml.workspace = true
chrono.workspace = true
blake3.workspace = true
data-encoding.workspace = true
# Asks for LDAP passwords without echoing them (`pumasi login --ldap`).
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
