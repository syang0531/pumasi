[package]
publish = false
name = "pumasi-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web dashboard for a Pumasi cluster (`pumasi ui`)"

[dependencies]
pumasi-proto.workspace = true
pumasi-cluster.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
iroh.workspace = true
rand.workspace = true
data-encoding.workspace = true
blake3.workspace = true
toml.workspace = true
n0-future.workspace = true
tokio-util = { workspace = true, features = ["io"] }
# The web server and its HTML templates, compiled into the binary.
axum.workspace = true
maud = "0.27"
crc32fast = "1"
# The S3 gateway (1.8): payload hashes, MD5 ETags, HTTP dates.
sha2.workspace = true
md-5.workspace = true
chrono.workspace = true
# HTTPS without a proxy (`--tls-cert`), on the same ring provider iroh uses.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
pumasi-agent.workspace = true
jsonwebtoken.workspace = true
ring.workspace = true
wat.workspace = true
tracing-subscriber.workspace = true
