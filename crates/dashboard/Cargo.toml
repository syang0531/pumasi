[package]
name = "pumasi-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web dashboard for a Pumasi cluster (`pumasi ui`)"

[dependencies]
pumasi-proto.workspace = true
pumasi-cluster.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
iroh.workspace = true
rand.workspace = true
data-encoding.workspace = true
n0-future.workspace = true
tokio-util = { workspace = true, features = ["io"] }
# The web server and its HTML templates, compiled into the binary.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json", "multipart"] }
maud = "0.27"
crc32fast = "1"

[dev-dependencies]
pumasi-agent.workspace = true
wat.workspace = true
tracing-subscriber.workspace = true
