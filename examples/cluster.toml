# The cluster as you want it: node labels, taints and cordons, account
# quotas, scheduled jobs. Apply it from wherever the admin ticket is:
#
#   pumasi apply -f examples/cluster.toml --dry-run   # what would change
#   pumasi apply -f examples/cluster.toml             # change it
#
# Applying it again changes nothing. Nodes and accounts the file does not
# list are left alone; schedules too, unless you pass --prune.

# Nodes by name (or id prefix). `labels` are the node's own labels (the
# built-in ones, like os, arch, gpu and disk, come from the node itself);
# `taints` keep away every job that does not tolerate them.
[nodes.desktop]
labels = { zone = "home", tier = "fast" }
taints = ["gpu-only"]              # only jobs with tolerations = ["gpu-only"]

[nodes.laptop]
labels = { zone = "home" }
cordoned = true                    # runs what it has, takes nothing new

# Limits per account. Leave a key out for no limit.
[accounts.alice]
slots = 8                          # tasks running at once
gpus = 1                           # GPUs in use at once
cu_per_day = 50                    # CU spent in any 24 hours
max_priority = 10                  # highest job priority it may ask for
storage = "100G"                   # file store space

[accounts.bob]
slots = 2

# Jobs submitted on a cron schedule (minute hour day month weekday, in the
# control plane's local time; @hourly, @daily, @weekly and @monthly work
# too). `job` is relative to this file.
[schedules.nightly-wordcount]
cron = "0 3 * * *"
job = "python-wordcount/job.toml"
account = "alice"
overlap = false                    # skip a run while the last one is going
