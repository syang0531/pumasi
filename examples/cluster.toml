# The cluster as you want it: node labels, taints and cordons, account
# quotas, scheduled jobs, alert rules and where alerts go. Apply it from wherever the admin ticket is:
#
#   pumasi apply -f examples/cluster.toml --dry-run   # what would change
#   pumasi apply -f examples/cluster.toml             # change it
#
# Applying it again changes nothing. Nodes and accounts the file does not
# list are left alone; schedules and webhooks too, unless you pass --prune.

# Nodes by name (or id prefix). `labels` are the node's own labels (the
# built-in ones, like os, arch, gpu and disk, come from the node itself);
# `taints` keep away every job that does not tolerate them.
[nodes.desktop]
labels = { zone = "home", tier = "fast" }
taints = ["gpu-only"]              # only jobs with tolerations = ["gpu-only"]

[nodes.laptop]
labels = { zone = "home" }
cordoned = true                    # runs what it has, takes nothing new

# Limits per account. Leave a key out for no limit.
[accounts.alice]
slots = 8                          # tasks running at once
gpus = 1                           # GPUs in use at once
cu_per_day = 50                    # CU spent in any 24 hours
max_priority = 10                  # highest job priority it may ask for
storage = "100G"                   # file store space

# CPU and memory its running tasks hold at once (1.9; a WASM task holds
# one CPU), and limits on the nodes a label selector picks.
cpus = 16
memory = "64G"

[[accounts.alice.label_quotas]]
selector = "zone=office"
slots = 4
cpus = 8
memory = "16G"

[accounts.bob]
slots = 2

# Jobs submitted on a cron schedule (minute hour day month weekday, in the
# control plane's local time, or in `tz`; @hourly, @daily, @weekly and
# @monthly work too). `job` is relative to this file.
[schedules.nightly-wordcount]
cron = "0 3 * * *"
tz = "Asia/Seoul"                  # 03:00 in Seoul, wherever the control plane is
job = "python-wordcount/job.toml"
account = "alice"
overlap = false                    # skip a run while the last one is going

# Alert rules. The section is the whole policy: a rule left out takes its
# default (shown here), "off" or false turns it off.
[alerts]
node_offline = "1m"                # a node (not cordoned) gone this long
failure_rate = "50%"               # of runs failing...
failure_window = "15m"             # ...over this long...
failure_min_runs = 10              # ...once there are at least this many
disk = "90%"                       # a node's disk or the control plane's
temperature = 90                   # °C, CPU or GPU
perf_drop = "25%"                  # a new benchmark this much slower
smart = true                       # a drive failing SMART or worn out
check_mismatch = true              # a check run disagreeing with a provider

# Where alerts go: a Slack or Mattermost incoming webhook, a Discord
# webhook, or any URL that takes JSON (format: slack, discord, json;
# guessed from the URL when left out). Keep the URL out of the file with
# url_env, read where you run `pumasi apply`:
#
# [webhooks.ops]
# url_env = "PUMASI_SLACK_WEBHOOK"   # or url = "https://hooks.slack.com/..."
# format = "slack"
