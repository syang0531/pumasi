# A shader that never ends, stopped by the job's timeout (1.10): the
# task ends as `timeout` after 20 seconds and the GPU takes the next task.
# Before 1.10 only the driver's watchdog stopped such a shader.
#   cargo build --release --target wasm32-wasip1 --manifest-path examples/webgpu/Cargo.toml
#   pumasi run examples/webgpu/forever.toml
name = "webgpu-forever"
module = "target/wasm32-wasip1/release/forever.wasm"
gpus = 1

[resources]
memory_mb = 64
timeout = "20s"
